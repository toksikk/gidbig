name: Require version label

# Gate every PR on having exactly the version label needed by version-tag.yaml,
# which derives the semver bump (major/minor/breaking → otherwise patch) from the
# merged PR's labels. Without this gate a mislabelled or unlabelled PR silently
# bumps as patch on merge.
#
# The labels are read back from the API rather than taken from
# github.event.pull_request. Creating a PR with a label in one step produces two
# events, so two runs are queued for the same commit; the "opened" run can sit in
# the queue until after the label exists and would then still judge a payload that
# never carried it. It fails, and as the newest run of this check it blocks the
# merge box until someone reopens the PR. Reading the live labels makes every run
# judge the state at the time it actually runs, whichever event started it.

on:
    pull_request:
        types: [opened, reopened, labeled, unlabeled, synchronize]
        branches:
            - master

permissions:
    contents: read
    pull-requests: read

jobs:
    require-label:
        name: Require version label
        runs-on: ubuntu-latest
        steps:
            - name: Check for a version label
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  set -o pipefail
                  if ! LABELS="$(gh pr view "$PR" --json labels --jq '.labels[].name' | tr '\n' ' ')"; then
                      echo "::error::Could not read the labels of PR #${PR}; re-run this check."
                      exit 1
                  fi
                  echo "PR labels: ${LABELS:-<none>}"
                  for label in $LABELS; do
                      case "$label" in
                          major | minor | breaking | patch)
                              echo "OK: found version label '$label'"
                              exit 0
                              ;;
                      esac
                  done
                  echo "::error::PR must carry one version label (major, minor, breaking, or patch) so version-tag.yaml bumps the version correctly on merge. Add the right label and re-run."
                  exit 1
