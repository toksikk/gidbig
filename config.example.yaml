discord:
    token: "YOUR_DISCORD_BOT_TOKEN"
    owner_id: "YOUR_DISCORD_USER_ID"
    shard_id: 0
    shard_count: 0
web:
    oauth:
        client_id: "YOUR_OAUTH_CLIENT_ID"
        client_secret: "YOUR_OAUTH_CLIENT_SECRET"
        redirect_uri: "YOUR_REDIRECT_URI"
    # At least 32 characters; generate with: openssl rand -base64 32
    session_secret: "base64-encoded-32-random-bytes"
    port: 8080
    # Optional. Guards for the unauthenticated, LLM-billed GET/POST /api/eso
    # endpoint. Omit the whole section (or any single key) to keep the default.
    eso:
        # Requests one client address may issue back to back. Default 5.
        rate_limit_burst: 5
        # Sustained per-client request rate. Default 30.
        rate_limit_per_minute: 30
        # Simultaneous generations; excess requests get 503. Default 4.
        max_concurrent_requests: 4
        # Timeout for one generation; on expiry the local fallback generator is
        # used instead of waiting for the provider. Default 15.
        request_timeout_seconds: 15
gippity:
    allowed_guilds:
        - "YOUR_DISCORD_GUILD_ID"
    ignored_users: []
    # Optional. Max AI replies per user per hour; defaults to 30 when omitted.
    rate_limit_messages_per_hour: 30
    # Optional. When true, the bot answers mentions inside a public thread
    # started on the mentioning message instead of posting in the channel.
    # Requires the Create Public Threads permission in the channel; if the
    # thread cannot be created the answer falls back to the channel.
    reply_in_thread: false
    # Optional. When true, the bot may also answer messages that do not mention
    # it: a classifier decides per message. Off by default (mention-only).
    # Each user must additionally opt in with /gippity nonmention set:on.
    respond_to_all_messages: false
    # Optional. Model for that classifier; empty falls back to llm.model.
    classifier_model: ""
    # Optional. Max classifier calls per user per hour; defaults to 30.
    classifier_rate_limit_per_hour: 30
    # Optional. Extra names the classifier treats as addressing the bot, on top
    # of the bot's own Discord username and display name. Use it for nicknames
    # or aliases so a message like "gustaff, ..." is recognised without a
    # mention.
    classifier_names: []
    # Optional. While debug logging is enabled the bot ignores every channel
    # except this one, so a debug run does not answer everywhere. Empty (the
    # default) disables the restriction and the bot answers in all channels.
    debug_channel: ""
    # Optional. LLM tool-calling. When enabled, the answer path may consult
    # internal data (for example stored chat history) while composing an
    # answer. Off by default: the answer path stays a single completion call.
    tools:
        enabled: false
        # Max tool-call rounds before a final tool-free answer is forced.
        # Defaults to 3 when omitted.
        max_iterations: 3
        # Optional allowlist of tool names; empty means all registered tools.
        # Registered tools: bot_status, search_chat_history,
        # get_channel_members, list_sounds, coffee_status, coffee_stats,
        # leetoclock_records, anticheat_lookup, wardogs_status, weather,
        # stoll_quote, current_game_status, tv_program.
        allowed: []
        # Sent only on requests that carry tools; cleared for the final
        # tool-free answer. Empty omits the field. Some providers forbid tools
        # together with reasoning and require "none" here.
        reasoning_effort: ""
soundboard:
    # Optional. Max sounds queued per guild before new requests are dropped;
    # defaults to 6 when omitted.
    queue_max_depth: 6
leetoclock:
    # Channels that receive the daily "Leet o'Clock scheduled" announcement.
    announcement_channels:
        - "YOUR_DISCORD_CHANNEL_ID"
    # Extra announcement channel, used only when debug is enabled.
    debug_channel: ""
    # Runs the game one minute after it is enabled with a 1s tick loop and
    # announces only to debug_channel. Hot: /admin config set leetoclock.debug
    # applies within one tick and changes live game behaviour while enabled;
    # debug rounds score messages from all channels into the real season. One round per enable; toggle off/on to re-run.
    debug: false
    # Optional custom guild emoji IDs used as reactions. When a value is
    # omitted or left empty, a standard Unicode emoji is used instead, so the
    # feature works on any server. Values may also be full Unicode emojis.
    emojis:
        zonk: ""
        lol: ""
        notamused: ""
        wat: ""
llm:
    # Optional provider and model settings. Provider defaults to openai and its
    # model defaults to gpt-4o-mini. OpenRouter requires an explicit model.
    provider: "openai" # openai or openrouter
    model: "gpt-4o-mini"
    # Optional separate model for image descriptions; defaults to model.
    vision_model: ""
    # Optional. Caps one completion: the shared client calls, the gippity answer
    # path and the image descriptions. Defaults to 300. The non-mention
    # classifier keeps its own much smaller bound and does not follow this.
    max_tokens: 300
    # Optional OpenAI-compatible endpoint override. Normally leave empty.
    base_url: ""
    # Optional OpenRouter app attribution headers.
    http_referer: ""
    title: "Gidbig"
    # Optional API key for the selected provider. In production prefer the
    # provider environment variable (OPENAI_API_KEY / OPENROUTER_API_KEY): when
    # it is set, it wins over this value.
    api_key: ""
    # Bot personality. Optional — if omitted, a built-in default persona is used.
    # Set a custom persona string here; it takes precedence over personality_preset.
    personality: ""
    # Or pick a predefined persona instead of writing your own. Used only when
    # personality is empty. One of: hal, schemer, dry, genalpha. Unknown values
    # fall back to the default. (hal = calm, logical, eerily polite
    # superintelligence; schemer = fake-friendly sarcastic manipulator;
    # dry = monotone, few words; genalpha = hyper Gen Alpha teen slang.)
    # Both personality and personality_preset can be changed at runtime with
    # /admin config (or the web admin panel); an unknown preset is rejected there.
    personality_preset: ""
# Optional TV program (/tv and the tv_program LLM tool) from the free-epg.de
# XMLTV feeds. Off by default; changes need a restart.
tv:
    enabled: false
    # Optional free-epg.de country feeds (two-letter codes, see
    # https://www.free-epg.de). Defaults to [de].
    # regions: [de, at]
    # Optional XMLTV channel IDs; replaces the built-in list of ~27 main
    # German channels. Required as soon as regions holds anything but de.
    # channels: ["DasErste.de", "ZDF.de", "ORF1.at"]
    # Optional IANA time zone for times and day boundaries.
    # Defaults to Europe/Berlin.
    # timezone: Europe/Berlin
    # Optional feed cache directory, relative to the working directory.
    # Defaults to "cache".
    # cache_dir: cache
    # Optional conditional-fetch period (minimum 1h). Defaults to 6h.
    # refresh_interval: 6h
# dev_mode picks the log format (text with source locations vs. JSON) and the
# discordgo log level at boot. The owner can flip it at runtime with
# /admin config, but only the log level (debug/info) follows; the rest needs a
# restart.
dev_mode: true

# tmdb enables the optional /wheretostream command and the streaming_providers
# LLM tool. Only the "API Read Access Token" from themoviedb.org -> Settings ->
# API is needed (not the short "API Key"). An empty or missing token disables
# the module; a token change needs a restart. region (default DE) and language
# (default de-DE) can also be changed at runtime with /admin config. TMDB's free
# tier is for non-commercial use; the bot credits JustWatch and TMDB as required.
# tmdb:
#   read_access_token: ""
#   region: DE
#   language: de-DE

# logs.window_lines is how many recent log records the bot keeps in memory for
# /admin logs show and the owner-only /admin/logs web page (0 or absent = 2000,
# max 100000). Nothing is written to disk. A change needs a restart.
# logs:
#   window_lines: 2000

# Runtime settings
#
# The owner can change the settings below at runtime with /admin config
# (owner only, ephemeral replies):
#
#   /admin config list                 effective value and source per key
#   /admin config get <key>            one key
#   /admin config set <key> <value>    store an override in the shared database
#   /admin config unset <key>          drop the override, back to config.yaml
#   /admin config add <key> <item>     add one item to a list key
#   /admin config remove <key> <item>  remove one item from a list key
#
# Precedence is: built-in default < config.yaml < database override. A value set
# with /admin config takes effect on the next message; no restart and no SSH.
# Every listed key is hot, and only these keys can be set this way
# (gippity.allowed_guilds and gippity.ignored_users are runtime-editable too;
# allowed_guilds can never become empty):
#
#   gippity.rate_limit_messages_per_hour   gippity.tools.enabled
#   gippity.reply_in_thread                gippity.tools.max_iterations
#   gippity.respond_to_all_messages        gippity.tools.allowed
#   gippity.classifier_model               gippity.tools.reasoning_effort
#   gippity.classifier_names               soundboard.queue_max_depth
#   gippity.classifier_rate_limit_per_hour llm.model
#   gippity.debug_channel                  llm.vision_model
#   gippity.allowed_guilds                 llm.max_tokens
#   dev_mode (log level only)
#   leetoclock.debug (warns: changes live game behaviour)
#   tmdb.region                            tmdb.language
#
# Every other non-secret key (discord.shard_id, web.port, llm.provider,
# other leetoclock.* keys, ...) is boot-time only: /admin config list and get show its value
# and source marked "restart required: edit config.yaml", and any write is
# refused. llm.base_url is shown with its userinfo and query masked. Secrets are never readable or writable at runtime and are reported as
# unknown;
# discord.token, tmdb.read_access_token and web.oauth.client_secret /
# web.session_secret stay in this
# file. The bot never writes config.yaml.
