version: '3'

services:
    app:
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            # Localhost only: terminate TLS in a reverse proxy in front of the bot.
            - "127.0.0.1:8080:8080"
        volumes:
            - ./config.yaml:/gidbig/config.yaml:ro
            - ./audio:/gidbig/audio
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
            interval: 30s
            timeout: 5s
            retries: 3
