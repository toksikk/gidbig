{{ define "sessionHandler" }}
<div class="inner-wrap">
  <div class="search-bar">
    <svg class="search-bar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="sound-search" placeholder="Search sounds…" autocomplete="off" spellcheck="false">
  </div>

  <div id="toast-stack"></div>

  <div id="queue-panel" class="d-none">
    <div class="queue-panel-hd">
      <span class="queue-dot"></span>
      <span class="queue-panel-title">Now Playing</span>
      <button class="queue-panel-close" onclick="document.getElementById('queue-panel').classList.add('d-none')" aria-label="Close">&#x2715;</button>
    </div>
    <div class="queue-panel-bd" id="queue-body"></div>
  </div>

  <script>
  // el builds an element whose text is set via textContent, never parsed as HTML.
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showToast(message, type) {
    var stack = document.getElementById('toast-stack');
    var item = el('div', 'toast-item ' + (type === 'success' ? 'is-success' : 'is-error'));
    var close = el('button', 'toast-close', '\u2715');
    close.setAttribute('aria-label', 'Dismiss');
    close.addEventListener('click', function() { dismissToast(item); });
    item.appendChild(el('span', 'toast-dot'));
    item.appendChild(el('span', 'toast-msg', message));
    item.appendChild(close);
    stack.appendChild(item);
    setTimeout(function() { dismissToast(item); }, 3500);
  }

  function dismissToast(item) {
    if (item.classList.contains('toast-out')) return;
    item.classList.add('toast-out');
    item.addEventListener('animationend', function() { item.remove(); }, { once: true });
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('sound-search').addEventListener('input', function() {
      var q = this.value.toLowerCase().trim();
      document.querySelectorAll('.sound-pad-wrapper').forEach(function(el) {
        var text = el.textContent.toLowerCase();
        el.classList.toggle('sound-hidden', q !== '' && !text.includes(q));
      });
    });

    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.pad-btn');
      if (!btn) return;
      var cmd = btn.dataset.cmd;
      var snd = btn.dataset.snd;
      btn.disabled = true;
      btn.textContent = '…';
      var body = new URLSearchParams();
      body.append('command', cmd);
      body.append('soundname', snd || '');
      fetch('/playsound', { method: 'POST', body: body })
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Play';
          if (res.ok) {
            var label = snd ? cmd + ' ' + snd : cmd + ' (random)';
            showToast('\u25B6 ' + label, 'success');
          } else if (res.status === 401) {
            showToast('Not logged in — please refresh.', 'error');
          } else {
            showToast('Could not play — are you in a voice channel?', 'error');
          }
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Play';
          showToast('Request failed — check your connection.', 'error');
        });
    });

    function pollQueue() {
      fetch('/api/queue')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var panel = document.getElementById('queue-panel');
          var body = document.getElementById('queue-body');
          var active = data.guilds && data.guilds.some(function(g) { return g.now_playing || g.queue_length > 0; });
          if (active) {
            panel.classList.remove('d-none');
            var rows = [];
            data.guilds.forEach(function(g) {
              if (g.now_playing || g.queue_length > 0) {
                var row = el('div', 'queue-row');
                if (g.now_playing) row.appendChild(el('span', 'queue-row-name', String(g.now_playing)));
                if (g.queue_length > 0) row.appendChild(el('span', 'queue-row-meta', '+' + Number(g.queue_length) + ' queued'));
                rows.push(row);
              }
            });
            if (rows.length === 0) {
              var empty = el('span', '', 'Nothing playing');
              empty.style.fontSize = '.68rem';
              empty.style.color = 'var(--text-2)';
              rows.push(empty);
            }
            body.replaceChildren.apply(body, rows);
          } else {
            panel.classList.add('d-none');
          }
        })
        .catch(function() {});
    }
    setInterval(pollQueue, 2500);
    pollQueue();
  });
  </script>
{{ end }}
